<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS14 FTL Translator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 14px; background: #111; color: #ddd; }
a { color: #58a6ff; }
#bar { background: #1a1a2e; padding: 8px 16px; display: flex; gap: 20px; align-items: center; border-bottom: 1px solid #333; font-size: 13px; flex-wrap: wrap; }
#bar .stat { color: #888; }
#bar .stat b { color: #ddd; }
.badge { padding: 2px 8px; border-radius: 3px; font-size: 11px; }
.badge-ok { background: #1a3a1a; color: #4caf50; }
.badge-warn { background: #3a2a1a; color: #ff9800; }
.badge-err { background: #3a1a1a; color: #f44336; }
#main { display: flex; height: calc(100vh - 42px); }
#side { width: 360px; min-width: 220px; border-right: 1px solid #333; display: flex; flex-direction: column; }
#side-hdr { padding: 8px; border-bottom: 1px solid #333; display: flex; gap: 6px; flex-wrap: wrap; }
#side-hdr input { flex: 1; min-width: 80px; background: #222; border: 1px solid #444; color: #ddd; padding: 4px 8px; border-radius: 3px; }
#file-list { flex: 1; overflow-y: auto; }
.fi { padding: 6px 10px; border-bottom: 1px solid #222; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.fi:hover { background: #1a1a2e; }
.fi.active { background: #1a2a3e; }
.fi-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.fi-count { font-size: 11px; white-space: nowrap; }
.fi-count.pending { color: #ff9800; }
.fi-count.done { color: #4caf50; }
#content { flex: 1; display: flex; flex-direction: column; }
#content-hdr { padding: 8px 16px; border-bottom: 1px solid #333; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#content-hdr h3 { font-size: 14px; font-weight: 600; flex: 1; }
#string-list { flex: 1; overflow-y: auto; padding: 8px 16px; }
.si { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; }
.si .key { font-size: 12px; color: #58a6ff; font-weight: 600; margin-bottom: 4px; }
.si .src { color: #aaa; margin-bottom: 2px; font-size: 13px; }
.si .existing { color: #888; font-size: 12px; margin-top: 2px; padding: 4px 6px; background: #151520; border-radius: 3px; white-space: pre-wrap; }
.si .existing::before { content: "EXISTING: "; font-weight: 600; color: #ff9800; }
.si .llm-result { color: #4caf50; font-size: 12px; margin-top: 2px; padding: 4px 6px; background: #152015; border-radius: 3px; white-space: pre-wrap; }
.si .llm-result::before { content: "LLM: "; font-weight: 600; }
.si .status-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
.status-ORIGINAL { background: #3a2a1a; color: #ff9800; }
.status-TRANSLATED { background: #1a3a1a; color: #4caf50; }
.status-BROKEN { background: #3a1a1a; color: #f44336; }
.btn { padding: 4px 12px; border: 1px solid #555; background: #222; color: #ddd; border-radius: 3px; cursor: pointer; font-size: 12px; }
.btn:hover { background: #333; }
.btn-primary { background: #1a4a6e; border-color: #2a6a9e; }
.btn-primary:hover { background: #2a5a8e; }
.btn-danger { background: #5a1a1a; border-color: #8a2a2a; }
.btn-danger:hover { background: #7a2a2a; }
.btn:disabled { opacity: .5; cursor: default; }
#progress-wrap { display: none; padding: 4px 16px; background: #1a1a1a; border-bottom: 1px solid #333; font-size: 12px; }
#progress-bar { height: 3px; background: #2a4a6e; border-radius: 2px; margin-top: 4px; }
#progress-fill { height: 100%; width: 0%; background: #4caf50; border-radius: 2px; transition: width .3s; }
.empty { padding: 40px; text-align: center; color: #555; }
select { background: #222; border: 1px solid #444; color: #ddd; padding: 3px 6px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>

<div id="bar">
  <span class="stat">SS14 FTL Translator</span>
  <span class="stat" id="bar-files">Files: <b>0</b></span>
  <span class="stat" id="bar-pending">Pending: <b>0</b></span>
  <span class="stat" id="bar-done">Done: <b>0</b></span>
  <span class="stat" id="bar-total">Total: <b>0</b></span>
  <span id="bar-llm" class="badge badge-warn">LLM: ?</span>
  <button class="btn btn-primary" id="btn-scan" onclick="scan('hard')">Scan</button>
  <button class="btn" id="btn-trans-all" onclick="translateAll()">Translate All</button>
  <button class="btn btn-danger" id="btn-cancel" onclick="cancel()" style="display:none">Cancel</button>
</div>

<div id="progress-wrap">
  <span id="progress-text">Idle</span>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<div id="main">
  <div id="side">
    <div id="side-hdr">
      <input id="filter" placeholder="Filter files..." oninput="renderFiles()">
      <select id="scope" onchange="renderFiles()">
        <option value="all">All</option>
        <option value="pending">Pending</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div id="file-list"></div>
  </div>
  <div id="content">
    <div id="content-hdr">
      <h3 id="file-title">Select a file</h3>
      <button class="btn btn-primary" id="btn-trans-file" onclick="translateFile()" style="display:none">Translate File</button>
    </div>
    <div id="string-list"></div>
  </div>
</div>

<script>
let state = { files: {}, items: {}, scanDone: false, selectedFile: null }
let pollTimer = null

function $(id) { return document.getElementById(id) }

function startPoll() {
  if (pollTimer) return
  pollTimer = setInterval(poll, 2000)
  poll()
}

function stopPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null }
}

async function poll() {
  try {
    const [status, progress] = await Promise.all([
      fetch("/api/status").then(r => r.json()),
      fetch("/api/progress").then(r => r.json()),
    ])
    updateStatus(status, progress)
  } catch (e) {}
}

function updateStatus(status, progress) {
  state.scanDone = status.scan_done
  $("bar-files").innerHTML = `Files: <b>${status.files}</b>`
  $("bar-pending").innerHTML = `Pending: <b>${status.counts?.ORIGINAL || 0}</b>`
  $("bar-done").innerHTML = `Done: <b>${status.counts?.TRANSLATED || 0}</b>`
  $("bar-total").innerHTML = `Total: <b>${status.strings || 0}</b>`

  const llmEl = $("bar-llm")
  llmEl.className = "badge " + (status.llm_api_base ? "badge-ok" : "badge-err")
  llmEl.textContent = status.llm_model || "no LLM"

  const sp = status.scan_progress || {}
  if (sp.phase && sp.phase !== "done" && !sp.phase.startsWith("error")) {
    $("progress-wrap").style.display = "block"
    $("progress-text").textContent = `${sp.phase} (${sp.done || 0}/${sp.total || 0})`
    $("progress-fill").style.width = sp.total > 0 ? `${(sp.done / sp.total) * 100}%` : "0%"
    $("btn-scan").disabled = true
  } else {
    $("progress-wrap").style.display = "none"
    $("btn-scan").disabled = false
  }

  const batch = progress.batch || {}
  if (batch.running) {
    $("progress-wrap").style.display = "block"
    $("progress-text").textContent = `Translating (${batch.done}/${batch.total})`
    $("progress-fill").style.width = batch.total > 0 ? `${(batch.done / batch.total) * 100}%` : "0%"
    $("btn-trans-file").disabled = true
    $("btn-trans-all").disabled = true
    $("btn-cancel").style.display = ""
  } else {
    $("btn-trans-file").disabled = false
    $("btn-trans-all").disabled = false
    $("btn-cancel").style.display = "none"
  }

  if (state.selectedFile) {
    loadFile(state.selectedFile)
  }

  if (status.scan_done) {
    loadFiles()
  }
}

async function loadFiles() {
  const q = $("filter").value
  const scope = $("scope").value
  try {
    const res = await fetch(`/api/files?q=${encodeURIComponent(q)}&scope=${scope}`)
    const files = await res.json()
    const el = $("file-list")
    el.innerHTML = files.map(f =>
      `<div class="fi ${f.rel === state.selectedFile ? 'active' : ''}" onclick="selectFile('${escAttr(f.rel)}')">
        <span class="fi-name">${f.rel}</span>
        <span class="fi-count">${f.total} strings</span>
        <span class="fi-count ${f.original > 0 ? 'pending' : 'done'}">${f.original > 0 ? f.original + ' pending' : 'done'}</span>
      </div>`
    ).join("")
    if (files.length === 0) el.innerHTML = '<div class="empty">No files</div>'
  } catch (e) {}
}

async function selectFile(rel) {
  state.selectedFile = rel
  loadFile(rel)
  loadFiles()
}

async function loadFile(rel) {
  try {
    const res = await fetch(`/api/file/${encodeURIComponent(rel)}`)
    const data = await res.json()
    if (!data.items) return
    $("file-title").textContent = rel
    const hasPending = data.items.some(i => i.status === "ORIGINAL")
    const hasAny = data.items.length > 0
    $("btn-trans-file").style.display = hasAny ? "" : "none"

    const el = $("string-list")
    el.innerHTML = data.items.map(i =>
      `<div class="si">
        <div class="key">
          ${esc(i.key)}
          <span class="status-tag status-${i.status}">${i.status}</span>
        </div>
        <div class="src">${esc(i.source_text) || '(no text)'}</div>
        ${i.existing_ftl ? `<div class="existing">${esc(i.existing_ftl)}</div>` : ''}
        ${i.llm_ftl ? `<div class="llm-result">${esc(i.llm_ftl)}</div>` : ''}
      </div>`
    ).join("")
    if (data.items.length === 0) el.innerHTML = '<div class="empty">No translatable entries</div>'
  } catch (e) {}
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\//g,'&#47;') }

async function scan(mode) {
  await fetch("/api/scan", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({mode}) })
  state.scanDone = false
}

async function translateFile() {
  if (!state.selectedFile) return
  await fetch("/api/translate", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({scope:"file", value: state.selectedFile}) })
}

async function translateAll() {
  await fetch("/api/translate", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({scope:"all"}) })
}

async function cancel() {
  await fetch("/api/cancel", { method: "POST" })
}

startPoll()
</script>
</body>
</html>
